name = "vergabe-radar-anmeldung"
main = "subscribe.js"
compatibility_date = "2026-01-01"

# Vor dem ersten Deploy:
#   npx wrangler kv namespace create SUBS      -> id hier eintragen
#   npx wrangler secret put RESEND_API_KEY
#   npx wrangler secret put EXPORT_KEY         -> lange Zufallszeichenkette
[[kv_namespaces]]
binding = "SUBS"
id = "HIER_DIE_KV_ID_EINTRAGEN"

[vars]
# MAIL_FROM muss auf einer Domain liegen, die bei Resend verifiziert ist.
# Ohne diesen Nachweis nimmt Resend nichts an - das ist vor dem ersten Deploy
# zu erledigen, nicht danach.
MAIL_FROM = "radar@example.de"

# Nur der Rueckweg zur Website (Fuss der Bestaetigungsmail). Der
# Bestaetigungslink selbst wird NICHT hieraus gebaut, sondern aus der eigenen
# Adresse des Workers - sonst zeigt er auf eine Seite, die /api/bestaetigen
# gar nicht bedient.
SITE_URL = "https://phifa96.github.io/Business-Idee/"

IMPRESSUM = "Vorname Nachname · Musterweg 1 · 12345 Musterstadt"
